<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="co-caro-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a0b55"/>
      <stop offset="1" stop-color="#1f0736"/>
    </linearGradient>
    <radialGradient id="co-caro-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5fc1" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#b13cd8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#b13cd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="co-caro-fade" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="co-caro-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
      <ellipse cx="800" cy="450" rx="760" ry="520" fill="url(#co-caro-fade)"/>
    </mask>
    <radialGradient id="co-caro-vig" cx="50%" cy="50%" r="72%">
      <stop offset=".5" stop-color="#0c0614" stop-opacity="0"/>
      <stop offset="1" stop-color="#0c0614" stop-opacity=".7"/>
    </radialGradient>
    <filter id="co-caro-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="co-caro-blur-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <path id="co-caro-spark" d="M0-24C3-6 6-3 24 0C6 3 3 6 0 24C-3 6-6 3-24 0C-6-3-3-6 0-24Z"/>

    <!-- marks, origin = cell centre (cells are 110) -->
    <g id="co-caro-x" fill="none" stroke-linecap="round">
      <path d="M-30-30L30 30M30-30L-30 30" stroke="#171326" stroke-width="38"/>
      <path d="M-30-30L30 30M30-30L-30 30" stroke="#ff3d9e" stroke-width="24"/>
      <path d="M-30-30L30 30M30-30L-30 30" stroke="#fff0f7" stroke-width="7"/>
    </g>
    <g id="co-caro-o" fill="none">
      <circle r="31" stroke="#171326" stroke-width="38"/>
      <circle r="31" stroke="#35e2ff" stroke-width="24"/>
      <circle r="31" stroke="#f0feff" stroke-width="7"/>
    </g>
    <path id="co-caro-xg" d="M-30-30L30 30M30-30L-30 30" fill="none" stroke="#ff3d9e" stroke-width="34" stroke-linecap="round"/>
    <circle id="co-caro-og" r="31" fill="none" stroke="#35e2ff" stroke-width="34"/>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#co-caro-bg)"/>
  <circle cx="800" cy="450" r="520" fill="url(#co-caro-glow)"/>

  <!-- far parallax grid -->
  <g mask="url(#co-caro-mask)" opacity=".35">
    <path fill="none" stroke="#b46cff" stroke-width="2"
      d="M-5 0V900M50 0V900M105 0V900M160 0V900M215 0V900M270 0V900M325 0V900M380 0V900M435 0V900M490 0V900M545 0V900M600 0V900M655 0V900M710 0V900M765 0V900M820 0V900M875 0V900M930 0V900M985 0V900M1040 0V900M1095 0V900M1150 0V900M1205 0V900M1260 0V900M1315 0V900M1370 0V900M1425 0V900M1480 0V900M1535 0V900M1590 0V900
         M0 0H1600M0 55H1600M0 110H1600M0 165H1600M0 220H1600M0 275H1600M0 330H1600M0 385H1600M0 440H1600M0 495H1600M0 550H1600M0 605H1600M0 660H1600M0 715H1600M0 770H1600M0 825H1600M0 880H1600"/>
  </g>

  <!-- main neon grid, fades to infinity -->
  <g mask="url(#co-caro-mask)">
    <g id="co-caro-lines" fill="none" stroke="#c77dff" stroke-width="4">
      <path d="M85 0V900M195 0V900M305 0V900M415 0V900M525 0V900M635 0V900M745 0V900M855 0V900M965 0V900M1075 0V900M1185 0V900M1295 0V900M1405 0V900M1515 0V900
               M0 65H1600M0 175H1600M0 285H1600M0 395H1600M0 505H1600M0 615H1600M0 725H1600M0 835H1600"/>
    </g>
    <use xlink:href="#co-caro-lines" href="#co-caro-lines" filter="url(#co-caro-blur-sm)"/>

    <!-- winning row: highlighted cells -->
    <g fill="#e8fc77" fill-opacity=".3" stroke="#e8fc77" stroke-width="6">
      <rect x="530" y="620" width="100" height="100" rx="18"/>
      <rect x="640" y="510" width="100" height="100" rx="18"/>
      <rect x="750" y="400" width="100" height="100" rx="18"/>
      <rect x="860" y="290" width="100" height="100" rx="18"/>
      <rect x="970" y="180" width="100" height="100" rx="18"/>
    </g>

    <!-- glow layer -->
    <g filter="url(#co-caro-blur)" opacity=".85">
      <use xlink:href="#co-caro-xg" href="#co-caro-xg" x="580" y="670"/>
      <use xlink:href="#co-caro-xg" href="#co-caro-xg" x="690" y="560"/>
      <use xlink:href="#co-caro-xg" href="#co-caro-xg" x="800" y="450"/>
      <use xlink:href="#co-caro-xg" href="#co-caro-xg" x="910" y="340"/>
      <use xlink:href="#co-caro-xg" href="#co-caro-xg" x="1020" y="230"/>
      <use xlink:href="#co-caro-og" href="#co-caro-og" x="690" y="450"/>
      <use xlink:href="#co-caro-og" href="#co-caro-og" x="800" y="560"/>
      <use xlink:href="#co-caro-og" href="#co-caro-og" x="910" y="450"/>
      <use xlink:href="#co-caro-og" href="#co-caro-og" x="800" y="340"/>
      <use xlink:href="#co-caro-og" href="#co-caro-og" x="1020" y="560"/>
    </g>

    <!-- outer, half-faded marks -->
    <use xlink:href="#co-caro-o" href="#co-caro-o" x="470" y="340"/>
    <use xlink:href="#co-caro-x" href="#co-caro-x" x="360" y="560"/>
    <use xlink:href="#co-caro-o" href="#co-caro-o" x="1130" y="670"/>
    <use xlink:href="#co-caro-x" href="#co-caro-x" x="1240" y="340"/>
    <use xlink:href="#co-caro-o" href="#co-caro-o" x="580" y="230"/>
    <use xlink:href="#co-caro-x" href="#co-caro-x" x="1130" y="450"/>
    <use xlink:href="#co-caro-o" href="#co-caro-o" x="250" y="340"/>
    <use xlink:href="#co-caro-x" href="#co-caro-x" x="1350" y="560"/>

    <!-- centre marks -->
    <use xlink:href="#co-caro-o" href="#co-caro-o" x="690" y="450"/>
    <use xlink:href="#co-caro-o" href="#co-caro-o" x="800" y="560"/>
    <use xlink:href="#co-caro-o" href="#co-caro-o" x="910" y="450"/>
    <use xlink:href="#co-caro-o" href="#co-caro-o" x="800" y="340"/>
    <use xlink:href="#co-caro-o" href="#co-caro-o" x="1020" y="560"/>
    <path d="M545 705L1055 195" stroke="#e8fc77" stroke-width="22" stroke-linecap="round" filter="url(#co-caro-blur)"/>
    <path d="M545 705L1055 195" stroke="#171326" stroke-width="22" stroke-linecap="round"/>
    <path d="M545 705L1055 195" stroke="#e8fc77" stroke-width="10" stroke-linecap="round"/>
    <use xlink:href="#co-caro-x" href="#co-caro-x" x="580" y="670"/>
    <use xlink:href="#co-caro-x" href="#co-caro-x" x="690" y="560"/>
    <use xlink:href="#co-caro-x" href="#co-caro-x" x="800" y="450"/>
    <use xlink:href="#co-caro-x" href="#co-caro-x" x="910" y="340"/>
    <use xlink:href="#co-caro-x" href="#co-caro-x" x="1020" y="230"/>
  </g>


  <!-- sparkles -->
  <g fill="#e8fc77">
    <use xlink:href="#co-caro-spark" href="#co-caro-spark" transform="translate(1100 170) scale(1.3)"/>
    <use xlink:href="#co-caro-spark" href="#co-caro-spark" transform="translate(500 760) scale(1)"/>
    <use xlink:href="#co-caro-spark" href="#co-caro-spark" transform="translate(1180 290) scale(.6)"/>
    <use xlink:href="#co-caro-spark" href="#co-caro-spark" transform="translate(420 640) scale(.6)"/>
  </g>
  <g stroke="#e8fc77" stroke-width="5" stroke-linecap="round" opacity=".8">
    <path d="M1000 140h18M1009 131v18"/>
    <path d="M620 780h16M628 772v16"/>
  </g>

  <rect width="1600" height="900" fill="url(#co-caro-vig)"/>
</svg>
