<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="co-ca-ngua-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2380"/>
      <stop offset="1" stop-color="#1a1450"/>
    </linearGradient>
    <radialGradient id="co-ca-ngua-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b9a3ff" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#7a5cff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7a5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="co-ca-ngua-vig" cx="50%" cy="50%" r="72%">
      <stop offset=".55" stop-color="#0a0a1a" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0a1a" stop-opacity=".6"/>
    </radialGradient>
    <pattern id="co-ca-ngua-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="2"/>
    </pattern>
    <clipPath id="co-ca-ngua-board-clip">
      <rect x="-300" y="-300" width="600" height="600" rx="26"/>
    </clipPath>
    <path id="co-ca-ngua-spark" d="M0-24C3-6 6-3 24 0C6 3 3 6 0 24C-3 6-6 3-24 0C-6-3-3-6 0-24Z"/>

    <!-- horse-head pawn; origin = centre of its base on the board. Fill comes from <use fill> -->
    <g id="co-ca-ngua-pawn">
      <ellipse cx="0" cy="4" rx="58" ry="20" fill="#0a0820" opacity=".35"/>
      <path d="M-48 -10V-24A48 17 0 0 1 48-24V-10A48 17 0 0 1-48-10Z" stroke="#171326" stroke-width="6" stroke-linejoin="round"/>
      <ellipse cx="0" cy="-24" rx="48" ry="17" fill="#fff" opacity=".22"/>
      <path d="M-34-26C-36-44-28-56-22-66C-32-84-36-108-26-128C-18-146 0-156 14-154L22-172L31-150C47-140 59-120 63-100C65-88 61-80 51-78C39-76 27-82 17-84C19-70 29-56 33-44C37-36 39-30 38-26Z" stroke="#171326" stroke-width="6" stroke-linejoin="round"/>
      <path d="M-4-150C-30-142-42-112-36-86L-24-92C-28-114-20-134-2-142Z" fill="#171326" opacity=".35"/>
      <path d="M-20-62C-30-82-30-104-22-120" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".4"/>
      <circle cx="24" cy="-120" r="7" fill="#171326"/>
      <circle cx="26" cy="-122" r="2.5" fill="#fff"/>
      <circle cx="52" cy="-90" r="3.5" fill="#171326"/>
    </g>

    <!-- die, origin = centre of cube -->
    <g id="co-ca-ngua-die" stroke="#171326" stroke-width="6" stroke-linejoin="round">
      <path d="M0-60L58-30L0 0L-58-30Z" fill="#ffffff"/>
      <path d="M-58-30L0 0V64L-58 34Z" fill="#d9d1f5"/>
      <path d="M58-30L0 0V64L58 34Z" fill="#b6a8e8"/>
      <ellipse cx="0" cy="-30" rx="13" ry="7.5" fill="#f9415f" stroke="none"/>
      <g fill="#171326" stroke="none">
        <ellipse cx="-40" cy="-4" rx="6" ry="8"/>
        <ellipse cx="-18" cy="30" rx="6" ry="8"/>
        <ellipse cx="16" cy="0" rx="6" ry="8"/>
        <ellipse cx="29" cy="16" rx="6" ry="8"/>
        <ellipse cx="42" cy="32" rx="6" ry="8"/>
      </g>
    </g>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#co-ca-ngua-bg)"/>
  <rect width="1600" height="900" fill="url(#co-ca-ngua-grid)"/>
  <circle cx="800" cy="470" r="460" fill="url(#co-ca-ngua-glow)"/>

  <!-- board thickness -->
  <path d="M376 490L800 736L1224 490V530L800 776L376 530Z" fill="#5b4494" stroke="#171326" stroke-width="6" stroke-linejoin="round"/>
  <path d="M800 736V776" stroke="#171326" stroke-width="4"/>

  <!-- board face: drawn top-down, projected isometrically -->
  <g transform="matrix(.7071 .41 -.7071 .41 800 490)">
    <g clip-path="url(#co-ca-ngua-board-clip)">
      <rect x="-300" y="-300" width="600" height="600" fill="#fdf7ea"/>
      <!-- yards -->
      <rect x="-300" y="-300" width="240" height="240" fill="#ff5468"/>
      <rect x="60" y="-300" width="240" height="240" fill="#3ccf7a"/>
      <rect x="60" y="60" width="240" height="240" fill="#ffcc33"/>
      <rect x="-300" y="60" width="240" height="240" fill="#4a8cff"/>
      <!-- home columns and start cells -->
      <rect x="-260" y="-20" width="200" height="40" fill="#ff5468"/>
      <rect x="-260" y="-60" width="40" height="40" fill="#ff5468"/>
      <rect x="-20" y="-260" width="40" height="200" fill="#3ccf7a"/>
      <rect x="20" y="-260" width="40" height="40" fill="#3ccf7a"/>
      <rect x="60" y="-20" width="200" height="40" fill="#ffcc33"/>
      <rect x="220" y="20" width="40" height="40" fill="#ffcc33"/>
      <rect x="-20" y="60" width="40" height="200" fill="#4a8cff"/>
      <rect x="-60" y="220" width="40" height="40" fill="#4a8cff"/>
      <!-- centre -->
      <path d="M-60-60L0 0L-60 60Z" fill="#ff5468"/>
      <path d="M-60-60L0 0L60-60Z" fill="#3ccf7a"/>
      <path d="M60-60L0 0L60 60Z" fill="#ffcc33"/>
      <path d="M-60 60L0 0L60 60Z" fill="#4a8cff"/>
      <!-- track grid -->
      <path vector-effect="non-scaling-stroke" fill="none" stroke="#171326" stroke-opacity=".55" stroke-width="2.5"
        d="M-300-20H-60M-300 20H-60M60-20H300M60 20H300M-20-300V-60M20-300V-60M-20 60V300M20 60V300
           M-260-60V60M-220-60V60M-180-60V60M-140-60V60M-100-60V60
           M100-60V60M140-60V60M180-60V60M220-60V60M260-60V60
           M-60-260H60M-60-220H60M-60-180H60M-60-140H60M-60-100H60
           M-60 100H60M-60 140H60M-60 180H60M-60 220H60M-60 260H60
           M-60-300V300M60-300V300M-300-60H300M-300 60H300"/>
      <!-- yard nests -->
      <g fill="#fdf7ea" stroke="#171326" stroke-width="4" vector-effect="non-scaling-stroke">
        <rect x="-264" y="-264" width="168" height="168" rx="22" vector-effect="non-scaling-stroke"/>
        <rect x="96" y="-264" width="168" height="168" rx="22" vector-effect="non-scaling-stroke"/>
        <rect x="96" y="96" width="168" height="168" rx="22" vector-effect="non-scaling-stroke"/>
        <rect x="-264" y="96" width="168" height="168" rx="22" vector-effect="non-scaling-stroke"/>
      </g>
      <g stroke="#171326" stroke-width="3" vector-effect="non-scaling-stroke">
        <g fill="#ff5468">
          <circle cx="-218" cy="-218" r="24" vector-effect="non-scaling-stroke"/><circle cx="-142" cy="-218" r="24" vector-effect="non-scaling-stroke"/>
          <circle cx="-218" cy="-142" r="24" vector-effect="non-scaling-stroke"/><circle cx="-142" cy="-142" r="24" vector-effect="non-scaling-stroke"/>
        </g>
        <g fill="#3ccf7a">
          <circle cx="142" cy="-218" r="24" vector-effect="non-scaling-stroke"/><circle cx="218" cy="-218" r="24" vector-effect="non-scaling-stroke"/>
          <circle cx="142" cy="-142" r="24" vector-effect="non-scaling-stroke"/><circle cx="218" cy="-142" r="24" vector-effect="non-scaling-stroke"/>
        </g>
        <g fill="#ffcc33">
          <circle cx="142" cy="142" r="24" vector-effect="non-scaling-stroke"/><circle cx="218" cy="142" r="24" vector-effect="non-scaling-stroke"/>
          <circle cx="142" cy="218" r="24" vector-effect="non-scaling-stroke"/><circle cx="218" cy="218" r="24" vector-effect="non-scaling-stroke"/>
        </g>
        <g fill="#4a8cff">
          <circle cx="-218" cy="142" r="24" vector-effect="non-scaling-stroke"/><circle cx="-142" cy="142" r="24" vector-effect="non-scaling-stroke"/>
          <circle cx="-218" cy="218" r="24" vector-effect="non-scaling-stroke"/><circle cx="-142" cy="218" r="24" vector-effect="non-scaling-stroke"/>
        </g>
      </g>
    </g>
    <rect x="-300" y="-300" width="600" height="600" rx="26" fill="none" stroke="#171326" stroke-width="6" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- pawns, back to front -->
  <use xlink:href="#co-ca-ngua-pawn" href="#co-ca-ngua-pawn" fill="#ff5468" transform="translate(800 344)"/>
  <use xlink:href="#co-ca-ngua-pawn" href="#co-ca-ngua-pawn" fill="#4a8cff" transform="translate(548 492)"/>
  <use xlink:href="#co-ca-ngua-pawn" href="#co-ca-ngua-pawn" fill="#3ccf7a" transform="translate(1052 492)"/>
  <use xlink:href="#co-ca-ngua-pawn" href="#co-ca-ngua-pawn" fill="#ffcc33" transform="translate(800 640)"/>

  <!-- dice -->
  <use xlink:href="#co-ca-ngua-die" href="#co-ca-ngua-die" transform="translate(1196 662) rotate(-6) scale(1.05)"/>
  <use xlink:href="#co-ca-ngua-die" href="#co-ca-ngua-die" transform="translate(420 290) rotate(14) scale(.72)"/>

  <!-- sparkles -->
  <g fill="#e8fc77">
    <use xlink:href="#co-ca-ngua-spark" href="#co-ca-ngua-spark" transform="translate(1180 300) scale(1.1)"/>
    <use xlink:href="#co-ca-ngua-spark" href="#co-ca-ngua-spark" transform="translate(960 230) scale(.7)"/>
    <use xlink:href="#co-ca-ngua-spark" href="#co-ca-ngua-spark" transform="translate(470 690) scale(.9)"/>
    <use xlink:href="#co-ca-ngua-spark" href="#co-ca-ngua-spark" transform="translate(1300 560) scale(.6)"/>
  </g>
  <g stroke="#e8fc77" stroke-width="5" stroke-linecap="round" opacity=".8">
    <path d="M620 220h18M629 211v18"/>
    <path d="M1100 760h16M1108 752v16"/>
    <path d="M340 480h16M348 472v16"/>
  </g>

  <rect width="1600" height="900" fill="url(#co-ca-ngua-vig)"/>
</svg>
