<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="co-tuong-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a4512"/>
      <stop offset="1" stop-color="#4a210a"/>
    </linearGradient>
    <radialGradient id="co-tuong-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffc768" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#ff9b45" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff9b45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="co-tuong-vig" cx="50%" cy="50%" r="72%">
      <stop offset=".5" stop-color="#140904" stop-opacity="0"/>
      <stop offset="1" stop-color="#140904" stop-opacity=".65"/>
    </radialGradient>
    <linearGradient id="co-tuong-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6c97e"/>
      <stop offset="1" stop-color="#e2a457"/>
    </linearGradient>
    <radialGradient id="co-tuong-piece-face" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff1d2"/>
      <stop offset="1" stop-color="#f0c98a"/>
    </radialGradient>
    <radialGradient id="co-tuong-hero-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="co-tuong-dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="22" r="2.5" fill="#fff" fill-opacity=".08"/>
    </pattern>
    <path id="co-tuong-spark" d="M0-24C3-6 6-3 24 0C6 3 3 6 0 24C-3 6-6 3-24 0C-6-3-3-6 0-24Z"/>

    <!-- piece body, origin = centre; ring and glyph use currentColor -->
    <g id="co-tuong-piece">
      <circle cy="10" r="44" fill="#a3622a" stroke="#171326" stroke-width="6"/>
      <circle r="44" fill="url(#co-tuong-piece-face)" stroke="#171326" stroke-width="6"/>
      <circle r="34" fill="none" stroke="currentColor" stroke-width="4"/>
    </g>
    <!-- hand-drawn glyphs (approx. 92 unit box) -->
    <g id="co-tuong-g-chariot" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-30-36H30M-22-24H22V12H-22ZM-22-6H22M-36 26H36M0-46V46"/>
    </g>
    <g id="co-tuong-g-advisor" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round">
      <path d="M-36-12H36M0-42V34M-22 34H22"/>
    </g>
    <g id="co-tuong-g-soldier" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0-46V-38M-32-30H32M-12-24L-24-4M-12-16L-4-8M14-24L2-4M14-16L24-8M-38 10H38M0 2V46"/>
    </g>
    <g id="co-tuong-g-general" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-22-46L-28-36M-34-30V42M-34-30H-10V-4H-34M-34 6H-8V36H-34M4 34V-16H38V26L31 32M21-46V46"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#co-tuong-bg)"/>
  <rect width="1600" height="900" fill="url(#co-tuong-dots)"/>
  <circle cx="800" cy="440" r="500" fill="url(#co-tuong-glow)"/>

  <g transform="translate(800 470) rotate(-5)">
    <!-- board slab -->
    <rect x="-470" y="-330" width="940" height="1000" rx="28" fill="#8e4f1f" stroke="#171326" stroke-width="6" transform="translate(0 18)"/>
    <rect x="-470" y="-340" width="940" height="1000" rx="28" fill="url(#co-tuong-wood)" stroke="#171326" stroke-width="6"/>
    <!-- wood grain -->
    <g fill="none" stroke="#b9772f" stroke-width="3" stroke-opacity=".35" stroke-linecap="round">
      <path d="M-450-300q200-20 420 6t440-10"/>
      <path d="M-450-190q240 22 460-4t420 12"/>
      <path d="M-450 170q220-24 450 4t430-8"/>
      <path d="M-450 280q200 18 440-6t440 10"/>
      <path d="M-450 400q240-20 460 6t420-6"/>
    </g>

    <!-- grid -->
    <g fill="none" stroke="#5a2b10" stroke-linecap="square">
      <rect x="-418" y="-288" width="836" height="1000" stroke-width="5"/>
      <path stroke-width="4" d="M-400-270V700M400-270V700
        M-300-270V130M-200-270V130M-100-270V130M0-270V130M100-270V130M200-270V130M300-270V130
        M-300 230V700M-200 230V700M-100 230V700M0 230V700M100 230V700M200 230V700M300 230V700
        M-400-270H400M-400-170H400M-400-70H400M-400 30H400M-400 130H400M-400 230H400M-400 330H400M-400 430H400
        M-100-270L100-70M100-270L-100-70"/>
      <path stroke-width="3.5" stroke-linecap="butt" d="M-308 -94V-78H-324M-308 -46V-62H-324M-292 -94V-78H-276M-292 -46V-62H-276M292 -94V-78H276M292 -46V-62H276M308 -94V-78H324M308 -46V-62H324M-392 6V22H-376M-392 54V38H-376M-208 6V22H-224M-208 54V38H-224M-192 6V22H-176M-192 54V38H-176M-8 6V22H-24M-8 54V38H-24M8 6V22H24M8 54V38H24M192 6V22H176M192 54V38H176M208 6V22H224M208 54V38H224M392 6V22H376M392 54V38H376"/>
    </g>
    <!-- river (no text): soft water band with waves -->
    <rect x="-398" y="134" width="796" height="92" fill="#7cc6c0" fill-opacity=".35"/>
    <g fill="none" stroke="#2f7f86" stroke-width="5" stroke-linecap="round" stroke-opacity=".7">
      <path d="M-330 166q25-16 50 0t50 0t50 0M-90 196q25-16 50 0t50 0t50 0M170 166q25-16 50 0t50 0t50 0"/>
    </g>

    <!-- pieces on the board -->
    <g color="#24191a">
      <g transform="translate(-400 -270)"><use xlink:href="#co-tuong-piece" href="#co-tuong-piece"/><use xlink:href="#co-tuong-g-chariot" href="#co-tuong-g-chariot" transform="scale(.6)"/></g>
      <g transform="translate(100 -270)"><use xlink:href="#co-tuong-piece" href="#co-tuong-piece"/><use xlink:href="#co-tuong-g-advisor" href="#co-tuong-g-advisor" transform="scale(.6)"/></g>
      <g transform="translate(-200 30)"><use xlink:href="#co-tuong-piece" href="#co-tuong-piece"/><use xlink:href="#co-tuong-g-soldier" href="#co-tuong-g-soldier" transform="scale(.6)"/></g>
      <g transform="translate(200 30)"><use xlink:href="#co-tuong-piece" href="#co-tuong-piece"/><use xlink:href="#co-tuong-g-soldier" href="#co-tuong-g-soldier" transform="scale(.6)"/></g>
    </g>
    <g color="#d0232e">
      <g transform="translate(300 -70)"><use xlink:href="#co-tuong-piece" href="#co-tuong-piece"/><use xlink:href="#co-tuong-g-chariot" href="#co-tuong-g-chariot" transform="scale(.6)"/></g>
      <g transform="translate(-300 230)"><use xlink:href="#co-tuong-piece" href="#co-tuong-piece"/><use xlink:href="#co-tuong-g-chariot" href="#co-tuong-g-chariot" transform="scale(.6)"/></g>
    </g>

    <!-- hero piece hovering above the river bank -->
    <circle cx="0" cy="-24" r="190" fill="url(#co-tuong-hero-glow)"/>
    <ellipse cx="0" cy="138" rx="84" ry="24" fill="#3b1a08" opacity=".35"/>
    <g color="#d0232e" transform="translate(0 -24) scale(1.95)">
      <use xlink:href="#co-tuong-piece" href="#co-tuong-piece"/>
      <use xlink:href="#co-tuong-g-general" href="#co-tuong-g-general" transform="scale(.6)"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#e8fc77">
    <use xlink:href="#co-tuong-spark" href="#co-tuong-spark" transform="translate(920 300) scale(1.2)"/>
    <use xlink:href="#co-tuong-spark" href="#co-tuong-spark" transform="translate(680 330) scale(.7)"/>
    <use xlink:href="#co-tuong-spark" href="#co-tuong-spark" transform="translate(1340 230) scale(.8)"/>
    <use xlink:href="#co-tuong-spark" href="#co-tuong-spark" transform="translate(250 620) scale(.7)"/>
  </g>
  <g stroke="#e8fc77" stroke-width="5" stroke-linecap="round" opacity=".8">
    <path d="M960 400h18M969 391v18"/>
    <path d="M230 260h16M238 252v16"/>
    <path d="M1360 640h16M1368 632v16"/>
  </g>

  <rect width="1600" height="900" fill="url(#co-tuong-vig)"/>
</svg>
