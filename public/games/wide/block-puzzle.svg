      <stop offset="0" stop-color="#1f2b80"/>
      <stop offset="1" stop-color="#121a4c"/>
    </linearGradient>
    <radialGradient id="block-puzzle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7f9bff" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#5b6cff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#5b6cff" stop-opacity="0"/>
