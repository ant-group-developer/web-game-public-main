name: ant-play

services:
  web:
    image: ${APP_IMAGE:-ant-play:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3100}
        # API ZOZO ID mà trình duyệt gọi để đăng nhập (nhúng vào JS lúc build). Trống → https://api.zozo.bio.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        # Mã đo lường GA4 (G-XXXXXXX), nhúng vào JS lúc build. Trống → không có Google Analytics.
        NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${NEXT_PUBLIC_GA4_MEASUREMENT_ID:-}
        # Để bước build dựng sẵn trang bằng dữ liệu thật (thiếu thì trang chủ sau deploy trống tới khi làm mới).
        API_INTERNAL_URL: ${API_INTERNAL_URL:-}
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3100}:${PORT:-3000}"
    # Cho phép dùng http://host.docker.internal:<port> khi API chạy trên máy host (Linux cần dòng này).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "${PORT:-3000}"
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      NEXT_TELEMETRY_DISABLED: "1"
      # API game (admin CMS). Phải truy cập được TỪ BÊN TRONG container: tên service cùng network
      # (vd http://api:3000) hoặc http://host.docker.internal:3000 — localhost ở đây là chính container web.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://host.docker.internal:3000}
      # Trùng với REVALIDATE_SECRET của API để webhook /api/revalidate được chấp nhận.
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      # API_LOG=1: ghi log mọi lần gọi API vào `docker logs` (lỗi thì luôn ghi).
      API_LOG: ${API_LOG:-}
      # Domain ảnh trên Cloudflare R2 (vd https://assets.zozo.bio) — chỉ để preconnect, không bắt buộc.
      ASSETS_ORIGIN: ${ASSETS_ORIGIN:-}
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
