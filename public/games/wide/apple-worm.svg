<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="apple-worm-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24501f"/>
      <stop offset=".65" stop-color="#3b6b1f"/>
      <stop offset="1" stop-color="#2a4a17"/>
    </linearGradient>
    <radialGradient id="apple-worm-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8fc77" stop-opacity=".5"/>
      <stop offset=".6" stop-color="#b7e05a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#b7e05a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="apple-worm-portal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f981ad" stop-opacity=".7"/>
      <stop offset="1" stop-color="#9d85d1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="apple-worm-vig" cx="50%" cy="50%" r="72%">
      <stop offset=".55" stop-color="#0a0c14" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0c14" stop-opacity=".6"/>
    </radialGradient>
    <linearGradient id="apple-worm-dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7784a"/>
      <stop offset="1" stop-color="#7a5333"/>
    </linearGradient>
    <pattern id="apple-worm-dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="22" r="2.5" fill="#fff" fill-opacity=".09"/>
    </pattern>
    <path id="apple-worm-spark" d="M0-24C3-6 6-3 24 0C6 3 3 6 0 24C-3 6-6 3-24 0C-6-3-3-6 0-24Z"/>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#apple-worm-sky)"/>
  <rect width="1600" height="900" fill="url(#apple-worm-dots)"/>
  <circle cx="780" cy="440" r="420" fill="url(#apple-worm-glow)"/>

  <!-- distant hills -->
  <path d="M0 900V700q160-90 330-30t320-20q170-70 330 10t330-30q150-40 290 30v240z" fill="#1d3a15" opacity=".8"/>
  <path d="M0 900V790q200-50 420 0t420-10q220-50 420 10t340-10v110z" fill="#152c10"/>

  <!-- soft clouds -->
  <g fill="#e9ffd0" opacity=".16">
    <path d="M260 260a36 36 0 0 1 62-22a46 46 0 0 1 86 16a28 28 0 0 1 4 54H270a28 28 0 0 1-10-48z"/>
    <path d="M1180 180a36 36 0 0 1 62-22a46 46 0 0 1 86 16a28 28 0 0 1 4 54h-142a28 28 0 0 1-10-48z"/>
  </g>

  <!-- small floating block, upper left -->
  <g transform="translate(400 250) rotate(-8)" stroke="#171326" stroke-width="6" stroke-linejoin="round">
    <path d="M-40 10h80v60q-40 30-80 0z" fill="url(#apple-worm-dirt)"/>
    <path d="M-46 -4h92v22q-8 12-16 2q-10 12-20 0q-10 12-20 0q-10 12-20 0q-8 10-16-2z" fill="#7ccf3a"/>
  </g>
  <!-- small floating block, right -->
  <g transform="translate(1250 640) rotate(6)" stroke="#171326" stroke-width="6" stroke-linejoin="round">
    <path d="M-34 8h68v50q-34 26-68 0z" fill="url(#apple-worm-dirt)"/>
    <path d="M-40 -4h80v20q-8 12-16 2q-12 12-24 0q-12 12-24 0q-8 10-16-2z" fill="#7ccf3a"/>
  </g>

  <!-- main floating island -->
  <g stroke="#171326" stroke-width="6" stroke-linejoin="round">
    <!-- rocky underside -->
    <path d="M346 676L1176 676L1150 720L1060 740L1000 790L900 800L840 840L760 820L680 800L600 770L500 760L420 720z" fill="#5a3d26"/>
    <!-- dirt blocks -->
    <rect x="340" y="560" width="720" height="122" fill="url(#apple-worm-dirt)"/>
    <rect x="1060" y="440" width="122" height="242" fill="url(#apple-worm-dirt)"/>
    <path d="M460 600V682M580 600V682M700 600V682M820 600V682M940 600V682M1060 600V682M1060 562H1182" fill="none" stroke-width="4" stroke-opacity=".55"/>
  </g>
  <g fill="#5a3d26" opacity=".7">
    <circle cx="400" cy="640" r="9"/><circle cx="520" cy="655" r="7"/><circle cx="640" cy="630" r="10"/>
    <circle cx="760" cy="652" r="8"/><circle cx="880" cy="636" r="9"/><circle cx="1000" cy="660" r="7"/>
    <circle cx="1120" cy="520" r="9"/><circle cx="1100" cy="620" r="8"/>
  </g>
  <!-- hanging roots -->
  <g fill="none" stroke="#3f2a19" stroke-width="5" stroke-linecap="round">
    <path d="M560 772q-6 30 6 56"/><path d="M860 806q10 24 0 48"/><path d="M1020 780q-4 22 8 40"/>
  </g>
  <!-- grass tops -->
  <g stroke="#171326" stroke-width="6" stroke-linejoin="round" fill="#7ccf3a">
    <path d="M308 546H1066V586q-14 16-28 2q-16 18-32 0q-16 18-32 0q-16 18-32 0q-16 18-32 0q-16 18-32 0q-16 18-32 0q-16 18-32 0q-16 18-32 0q-16 18-32 0q-16 18-32 0q-16 18-32 0q-16 18-32 0q-16 18-32 0q-16 18-32 0q-16 18-32 0q-16 18-32 0q-16 18-32 0q-16 18-32 0q-16 18-32 0q-16 18-32 0q-16 18-32 0q-16 18-32 0q-14 16-26-2z"/>
    <path d="M1052 426H1190V466q-14 16-28 2q-16 18-32 0q-16 18-32 0q-16 18-32 0q-12 14-26-2z"/>
  </g>
  <g fill="#b6f06a">
    <rect x="316" y="552" width="744" height="8" rx="4"/>
    <rect x="1058" y="432" width="126" height="8" rx="4"/>
  </g>

  <!-- exit portal -->
  <circle cx="1121" cy="330" r="170" fill="url(#apple-worm-portal-glow)"/>
  <g stroke="#171326" stroke-width="6">
    <ellipse cx="1121" cy="336" rx="66" ry="96" fill="#5b4494"/>
    <ellipse cx="1121" cy="342" rx="48" ry="74" fill="#9d85d1" stroke="none"/>
    <ellipse cx="1121" cy="350" rx="32" ry="52" fill="#f981ad" stroke="none"/>
    <ellipse cx="1121" cy="358" rx="16" ry="28" fill="#ffe1ee" stroke="none"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".6">
    <path d="M1080 300q10-40 50-44"/><path d="M1158 380q-6 34-40 44"/>
  </g>

  <!-- worm -->
  <g stroke="#171326" stroke-width="6">
    <circle cx="420" cy="516" r="32" fill="#7cd448"/>
    <circle cx="482" cy="506" r="38" fill="#8be04e"/>
    <circle cx="552" cy="496" r="42" fill="#7cd448"/>
    <circle cx="628" cy="490" r="45" fill="#8be04e"/>
    <circle cx="718" cy="474" r="58" fill="#9ae85a"/>
  </g>
  <!-- segment shine -->
  <g fill="#e8ffc4" opacity=".7">
    <ellipse cx="410" cy="500" rx="10" ry="6"/>
    <ellipse cx="470" cy="486" rx="12" ry="7"/>
    <ellipse cx="538" cy="472" rx="14" ry="8"/>
    <ellipse cx="612" cy="464" rx="15" ry="8"/>
  </g>
  <!-- head face -->
  <g stroke="#171326" stroke-width="5">
    <circle cx="712" cy="440" r="20" fill="#fff"/>
    <circle cx="752" cy="446" r="18" fill="#fff"/>
  </g>
  <g fill="#171326">
    <circle cx="719" cy="442" r="9"/>
    <circle cx="759" cy="448" r="8"/>
  </g>
  <g fill="#fff"><circle cx="722" cy="438" r="3"/><circle cx="762" cy="444" r="3"/></g>
  <path d="M742 488q22 4 36-10q4 30-20 36q-16 2-16-26z" fill="#c2304b" stroke="#171326" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="700" cy="488" rx="12" ry="7" fill="#f981ad" opacity=".75"/>

  <!-- apple -->
  <g transform="translate(888 488)">
    <ellipse cx="0" cy="62" rx="50" ry="10" fill="#171326" opacity=".25"/>
    <path d="M2-40C4-54 10-62 18-68" fill="none" stroke="#171326" stroke-width="16" stroke-linecap="round"/>
    <path d="M2-40C4-54 10-62 18-68" fill="none" stroke="#8a5530" stroke-width="7" stroke-linecap="round"/>
    <path d="M10-50C24-74 54-74 62-62C48-46 26-42 10-50Z" fill="#7ccf3a" stroke="#171326" stroke-width="5" stroke-linejoin="round"/>
    <path d="M0-34C20-54 62-46 62-4C64 36 32 62 0 52C-32 62-64 36-62-4C-62-46-20-54 0-34Z" fill="#ff4b5c" stroke="#171326" stroke-width="6" stroke-linejoin="round"/>
    <path d="M32 40C46 28 54 12 54-6" fill="none" stroke="#c42a3f" stroke-width="8" stroke-linecap="round" opacity=".7"/>
    <ellipse cx="-30" cy="-14" rx="10" ry="18" fill="#fff" opacity=".6" transform="rotate(20 -30 -14)"/>
  </g>

  <!-- sparkles -->
  <g fill="#e8fc77">
    <use xlink:href="#apple-worm-spark" href="#apple-worm-spark" transform="translate(960 380) scale(1.1)"/>
    <use xlink:href="#apple-worm-spark" href="#apple-worm-spark" transform="translate(830 360) scale(.6)"/>
    <use xlink:href="#apple-worm-spark" href="#apple-worm-spark" transform="translate(1230 240) scale(.8)"/>
    <use xlink:href="#apple-worm-spark" href="#apple-worm-spark" transform="translate(560 330) scale(.7)"/>
  </g>
  <g stroke="#e8fc77" stroke-width="5" stroke-linecap="round" opacity=".8">
    <path d="M1000 470h18M1009 461v18"/>
    <path d="M660 360h16M668 352v16"/>
    <path d="M1230 420h16M1238 412v16"/>
  </g>

  <rect width="1600" height="900" fill="url(#apple-worm-vig)"/>
</svg>
