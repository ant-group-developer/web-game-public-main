<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="city-bloxx-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a7a"/>
      <stop offset=".6" stop-color="#11679a"/>
      <stop offset="1" stop-color="#0f8f9a"/>
    </linearGradient>
    <radialGradient id="city-bloxx-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7ff3ff" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#3bc6e0" stop-opacity=".18"/>
      <stop offset="1" stop-color="#3bc6e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="city-bloxx-vig" cx="50%" cy="50%" r="72%">
      <stop offset=".55" stop-color="#0a0c1c" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0c1c" stop-opacity=".6"/>
    </radialGradient>
    <linearGradient id="city-bloxx-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="city-bloxx-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="2"/>
    </pattern>
    <path id="city-bloxx-spark" d="M0-24C3-6 6-3 24 0C6 3 3 6 0 24C-3 6-6 3-24 0C-6-3-3-6 0-24Z"/>
    <!-- one apartment floor, origin at its top-centre, 300 x 72 -->
    <g id="city-bloxx-floor-windows">
      <rect x="-146" y="4" width="292" height="10" rx="3" fill="#fff" opacity=".35" stroke="none"/>
      <rect x="114" y="14" width="32" height="54" fill="#171326" opacity=".16" stroke="none"/>
     <g fill="#fff6c4" stroke="#171326" stroke-width="5">
      <rect x="-124" y="22" width="44" height="34" rx="4"/>
      <rect x="-56" y="22" width="44" height="34" rx="4"/>
      <rect x="12" y="22" width="44" height="34" rx="4"/>
      <rect x="80" y="22" width="44" height="34" rx="4"/>
     </g>
    </g>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#city-bloxx-sky)"/>
  <rect width="1600" height="900" fill="url(#city-bloxx-grid)"/>
  <circle cx="800" cy="430" r="400" fill="url(#city-bloxx-glow)"/>

  <!-- soft clouds -->
  <g fill="#bff4ff" opacity=".22">
    <path d="M300 300a40 40 0 0 1 70-26a52 52 0 0 1 96 18a32 32 0 0 1 6 62H312a32 32 0 0 1-12-54z"/>
    <path d="M1160 220a36 36 0 0 1 62-22a46 46 0 0 1 86 16a28 28 0 0 1 4 54h-142a28 28 0 0 1-10-48z"/>
  </g>

  <!-- far skyline -->
  <g fill="#1a5d8f" opacity=".85">
    <path d="M0 900V610h70v-40h60v40h40V540h90v90h50V600h70v300z"/>
    <path d="M1080 900V560h80v50h50V500h100v80h40v-30h80v60h60v-40h110v350z"/>
  </g>
  <!-- near skyline -->
  <g fill="#123c6a">
    <path d="M0 900V700h110V650h80v60h60V620h100v280z"/>
    <path d="M1180 900V640h90v-40h90v70h80V620h80v60h80v220z"/>
  </g>
  <g fill="#7fe3ff" opacity=".35">
    <rect x="30" y="725" width="18" height="22"/><rect x="70" y="725" width="18" height="22"/>
    <rect x="210" y="680" width="18" height="22"/><rect x="290" y="650" width="18" height="22"/>
    <rect x="290" y="700" width="18" height="22"/><rect x="1210" y="670" width="18" height="22"/>
    <rect x="1300" y="630" width="18" height="22"/><rect x="1470" y="650" width="18" height="22"/>
    <rect x="1470" y="700" width="18" height="22"/><rect x="1540" y="710" width="18" height="22"/>
  </g>

  <!-- crane jib -->
  <g stroke="#171326" stroke-width="6" stroke-linejoin="round">
    <rect x="250" y="64" width="1100" height="40" rx="6" fill="#ffc94d"/>
    <path d="M270 104l40-40l40 40l40-40l40 40l40-40l40 40l40-40l40 40l40-40l40 40l40-40l40 40l40-40l40 40l40-40l40 40l40-40l40 40l40-40l40 40l40-40l40 40l40-40l40 40l40-40l40 40" fill="none" stroke-width="5"/>
    <!-- trolley -->
    <rect x="820" y="96" width="90" height="34" rx="8" fill="#ff9b65"/>
    <circle cx="842" cy="100" r="9" fill="#171326"/>
    <circle cx="888" cy="100" r="9" fill="#171326"/>
  </g>

  <!-- swinging block (rotates around trolley) -->
  <g transform="rotate(-9 865 128)">
    <path d="M865 128V246" stroke="#171326" stroke-width="7"/>
    <path d="M745 300L865 246L985 300" fill="none" stroke="#171326" stroke-width="5" stroke-linejoin="round"/>
    <path d="M851 232a18 18 0 1 0 28 0" fill="none" stroke="#171326" stroke-width="12" stroke-linecap="round"/>
    <path d="M851 232a18 18 0 1 0 28 0" fill="none" stroke="#c9d3e6" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(865 300)">
      <rect x="-150" y="0" width="300" height="76" rx="8" fill="#e8fc77" stroke="#171326" stroke-width="6"/>
      <use xlink:href="#city-bloxx-floor-windows" href="#city-bloxx-floor-windows" y="2"/>
    </g>
  </g>
  <!-- swing trail -->
  <g fill="none" stroke="#e8fc77" stroke-width="6" stroke-linecap="round" opacity=".55">
    <path d="M1060 330q30 40 30 90"/>
    <path d="M1100 300q36 50 34 120" opacity=".6"/>
  </g>

  <!-- the stack -->
  <g stroke="#171326" stroke-width="6" stroke-linejoin="round">
    <g transform="translate(796 828)">
      <rect x="-150" y="0" width="300" height="80" rx="6" fill="#9d85d1"/>
      <rect x="-30" y="16" width="60" height="64" fill="#5b4494"/>
    </g>
    <g transform="translate(806 756)">
      <rect x="-150" y="0" width="300" height="72" rx="6" fill="#f981ad"/>
      <use xlink:href="#city-bloxx-floor-windows" href="#city-bloxx-floor-windows"/>
    </g>
    <g transform="translate(792 684)">
      <rect x="-150" y="0" width="300" height="72" rx="6" fill="#ff9b65"/>
      <use xlink:href="#city-bloxx-floor-windows" href="#city-bloxx-floor-windows"/>
    </g>
    <g transform="translate(803 612)">
      <rect x="-150" y="0" width="300" height="72" rx="6" fill="#4fd1c5"/>
      <use xlink:href="#city-bloxx-floor-windows" href="#city-bloxx-floor-windows"/>
    </g>
    <g transform="translate(814 540)">
      <rect x="-150" y="0" width="300" height="72" rx="6" fill="#9d85d1"/>
      <use xlink:href="#city-bloxx-floor-windows" href="#city-bloxx-floor-windows"/>
    </g>
    <g transform="translate(800 468)">
      <rect x="-150" y="0" width="300" height="72" rx="6" fill="#f981ad"/>
      <use xlink:href="#city-bloxx-floor-windows" href="#city-bloxx-floor-windows"/>
    </g>
  </g>
  <!-- sparkles -->
  <g fill="#e8fc77">
    <use xlink:href="#city-bloxx-spark" href="#city-bloxx-spark" transform="translate(560 420) scale(1.2)"/>
    <use xlink:href="#city-bloxx-spark" href="#city-bloxx-spark" transform="translate(1060 520) scale(.9)"/>
    <use xlink:href="#city-bloxx-spark" href="#city-bloxx-spark" transform="translate(1190 230) scale(.7)"/>
    <use xlink:href="#city-bloxx-spark" href="#city-bloxx-spark" transform="translate(430 200) scale(.6)"/>
  </g>
  <g stroke="#e8fc77" stroke-width="5" stroke-linecap="round" opacity=".8">
    <path d="M600 280h20M610 270v20"/>
    <path d="M1140 420h20M1150 410v20"/>
    <path d="M470 600h16M478 592v16"/>
  </g>

  <rect width="1600" height="900" fill="url(#city-bloxx-vig)"/>
</svg>
