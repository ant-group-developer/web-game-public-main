name: ant-play

services:
  web:
    image: ${APP_IMAGE:-ant-play:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3100}
        NEXT_PUBLIC_APPLE_WORM_EMBED_URL: ${NEXT_PUBLIC_APPLE_WORM_EMBED_URL:-https://apple-worm.antfootage.net/embed/apple-worm}
        NEXT_PUBLIC_CITY_BLOXX_EMBED_URL: ${NEXT_PUBLIC_CITY_BLOXX_EMBED_URL:-https://citybloxx.antfootage.net/embed?lang=vi&screen=quick}
        NEXT_PUBLIC_LUDO_EMBED_URL: ${NEXT_PUBLIC_LUDO_EMBED_URL:-https://ludo.antfootage.net/}
        NEXT_PUBLIC_BLOCK_PUZZLE_EMBED_URL: ${NEXT_PUBLIC_BLOCK_PUZZLE_EMBED_URL:-https://block-puzzle.antfootage.net/play}
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3100}:${PORT:-3000}"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "${PORT:-3000}"
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      NEXT_TELEMETRY_DISABLED: "1"
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
